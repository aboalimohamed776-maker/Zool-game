name: Build Zool APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          
      - name: Setup Android folder
        run: |
          mv lib/main.dart /tmp/main.dart.bak
          rm -f pubspec.yaml
          flutter create . --org com.zoolfast --project-name zool_game --platforms=android
          mv /tmp/main.dart.bak lib/main.dart
          cat > pubspec.yaml << 'EOF'
          name: zool_game
          description: Zool - Sudanese boy adventure game
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flame: ^1.17.0
          flutter:
            uses-material-design: true
          EOF
          
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zool-apk
          path: build/app/outputs/flutter-apk/app-release.apk
