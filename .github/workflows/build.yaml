name: Build Zool APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          mv lib/main.dart /tmp/main.dart.bak
          flutter create . --project-name zool_game --org com.zoolfast --platforms android --no-pub
          mv /tmp/main.dart.bak lib/main.dart
          cat > pubspec.yaml << 'EOF'
          name: zool_game
          description: Zool - Sudanese boy adventure game - Nile crocodiles & golden sunset
          publish_to: 'none'
          version: 1.0.0+3
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flame: ^1.17.0
          flutter:
            uses-material-design: true
            assets:
              - assets/images/zool_boy.png
              - assets/images/croc.png
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zool-apk
          path: build/app/outputs/flutter-apk/app-release.apk
